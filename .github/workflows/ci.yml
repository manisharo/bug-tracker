name : CI

on: 
   push:
      branches:
        - main
   workflow_dispatch:


jobs:
  unit-test-backend:
    runs-on: ubuntu_latest
    steps:
        - uses: actions/checkout@v4

        - name: Set up GO
          uses: actions/setup-go@v4
          with: 
               go-version: "1.21"
               cache-dependency-path: bugtracker-backend/go.sum

        - name: Execute Backend test
          working-directory: ./bugtracker-backend
          run: |
            go test -v ./...
            


